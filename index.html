<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘의 아이스크림 추천 🍦</title>
<style>
  :root {
    --pink: #ff8fab;
    --sky: #8ecae6;
    --cream: #fff3e0;
    --dark: #4a3f35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, var(--sky) 0%, var(--pink) 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--cream);
    border-radius: 24px;
    max-width: 480px;
    width: 100%;
    padding: 32px 28px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    margin: 0 0 4px;
    color: var(--dark);
  }
  .subtitle {
    text-align: center;
    color: #8a7b6c;
    font-size: 0.9rem;
    margin-bottom: 24px;
  }
  .weather-box {
    background: #fff;
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.95rem;
    color: var(--dark);
    min-height: 24px;
  }
  .weather-box .icon { font-size: 1.6rem; }
  label {
    display: block;
    font-weight: 600;
    color: var(--dark);
    margin-bottom: 8px;
    font-size: 0.95rem;
  }
  textarea {
    width: 100%;
    border: 2px solid #ffd6a5;
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 1rem;
    resize: none;
    height: 80px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--pink); }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: var(--pink);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
  }
  button:hover:not(:disabled) { background: #ff6b95; transform: translateY(-1px); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .result {
    margin-top: 24px;
    background: #fff;
    border-radius: 18px;
    padding: 20px;
    display: none;
    animation: fadeIn 0.4s ease;
  }
  .result.show { display: block; }
  .result h2 {
    margin: 0 0 8px;
    font-size: 1.2rem;
    color: var(--dark);
  }
  .result p {
    margin: 0;
    color: #5a4d3f;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .error {
    margin-top: 16px;
    color: #c0392b;
    font-size: 0.9rem;
    text-align: center;
    display: none;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .loader {
    display: none;
    text-align: center;
    margin-top: 16px;
    color: var(--dark);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>오늘의 아이스크림 추천 🍦</h1>
    <p class="subtitle">지금 날씨와 내 기분을 알려주면 AI가 딱 맞는 아이스크림을 골라줘요</p>

    <div class="weather-box" id="weatherBox">
      <span class="icon">📍</span>
      <span id="weatherText">위치 정보를 불러오는 중...</span>
    </div>

    <label for="moodInput">오늘 기분이 어떤가요?</label>
    <textarea id="moodInput" placeholder="예: 시험이 끝나서 홀가분하고 신나요!"></textarea>

    <button id="submitBtn">아이스크림 추천받기</button>

    <div class="loader" id="loader">AI가 오늘의 아이스크림을 고르고 있어요...</div>
    <div class="error" id="errorBox"></div>

    <div class="result" id="resultBox">
      <h2 id="resultTitle">🍨 추천 결과</h2>
      <p id="resultText"></p>
    </div>
  </div>

<script>
  const weatherText = document.getElementById('weatherText');
  const weatherBox = document.getElementById('weatherBox');
  const moodInput = document.getElementById('moodInput');
  const submitBtn = document.getElementById('submitBtn');
  const loader = document.getElementById('loader');
  const errorBox = document.getElementById('errorBox');
  const resultBox = document.getElementById('resultBox');
  const resultText = document.getElementById('resultText');

  let currentWeather = null; // { temperature, weatherDescription, locationLabel }

  // 날씨 코드를 한글 설명으로 변환 (Open-Meteo WMO 코드 기준)
  function describeWeatherCode(code) {
    const map = {
      0: { text: "맑음", icon: "☀️" },
      1: { text: "대체로 맑음", icon: "🌤️" },
      2: { text: "구름 조금", icon: "⛅" },
      3: { text: "흐림", icon: "☁️" },
      45: { text: "안개", icon: "🌫️" },
      48: { text: "안개", icon: "🌫️" },
      51: { text: "약한 이슬비", icon: "🌦️" },
      53: { text: "이슬비", icon: "🌦️" },
      55: { text: "강한 이슬비", icon: "🌧️" },
      61: { text: "약한 비", icon: "🌧️" },
      63: { text: "비", icon: "🌧️" },
      65: { text: "강한 비", icon: "🌧️" },
      71: { text: "약한 눈", icon: "🌨️" },
      73: { text: "눈", icon: "🌨️" },
      75: { text: "강한 눈", icon: "❄️" },
      80: { text: "소나기", icon: "🌦️" },
      81: { text: "소나기", icon: "🌦️" },
      82: { text: "강한 소나기", icon: "⛈️" },
      95: { text: "뇌우", icon: "⛈️" },
      96: { text: "우박 동반 뇌우", icon: "⛈️" },
      99: { text: "우박 동반 뇌우", icon: "⛈️" },
    };
    return map[code] || { text: "알 수 없음", icon: "🌡️" };
  }

  async function fetchWeather(lat, lon) {
    // Open-Meteo: API 키 없이 사용 가능한 무료 날씨 API
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('날씨 정보를 가져오지 못했습니다.');
    const data = await res.json();
    const temp = data.current.temperature_2m;
    const code = data.current.weather_code;
    const desc = describeWeatherCode(code);
    return { temperature: temp, weatherDescription: desc.text, icon: desc.icon };
  }

  async function initWeather() {
    if (!navigator.geolocation) {
      weatherText.textContent = "이 브라우저는 위치 정보를 지원하지 않아요. 서울 기준으로 안내할게요.";
      currentWeather = await fetchWeather(37.5665, 126.9780);
      renderWeather();
      return;
    }
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        try {
          currentWeather = await fetchWeather(pos.coords.latitude, pos.coords.longitude);
          renderWeather();
        } catch (e) {
          weatherText.textContent = "날씨 정보를 불러오지 못했어요.";
        }
      },
      async () => {
        // 위치 권한 거부 시 서울 기준으로 대체
        weatherText.textContent = "위치 권한이 없어 서울 기준으로 안내할게요.";
        try {
          currentWeather = await fetchWeather(37.5665, 126.9780);
          renderWeather();
        } catch (e) {
          weatherText.textContent = "날씨 정보를 불러오지 못했어요.";
        }
      }
    );
  }

  function renderWeather() {
    if (!currentWeather) return;
    weatherBox.querySelector('.icon').textContent = currentWeather.icon;
    weatherText.textContent = `현재 기온 ${Math.round(currentWeather.temperature)}°C, ${currentWeather.weatherDescription}`;
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }

  function hideError() {
    errorBox.style.display = 'none';
  }

  submitBtn.addEventListener('click', async () => {
    const mood = moodInput.value.trim();
    hideError();
    resultBox.classList.remove('show');

    if (!mood) {
      showError('기분을 입력해주세요!');
      return;
    }
    if (!currentWeather) {
      showError('아직 날씨 정보를 불러오는 중이에요. 잠시만 기다려주세요.');
      return;
    }

    submitBtn.disabled = true;
    loader.style.display = 'block';

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mood,
          weather: currentWeather
        })
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || '추천을 받아오지 못했어요.');
      }

      const data = await res.json();
      resultText.textContent = data.recommendation;
      resultBox.classList.add('show');
    } catch (e) {
      showError(e.message || '오류가 발생했어요. 다시 시도해주세요.');
    } finally {
      submitBtn.disabled = false;
      loader.style.display = 'none';
    }
  });

  initWeather();
</script>
</body>
</html>
